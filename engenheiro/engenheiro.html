<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto Teseu // Módulo Engenheiro</title>
    <!-- Importando o Chart.js para renderizar os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Importando o CSS externo -->
    <link rel="stylesheet" href="engenheiro.css">
</head>
<body>

    <div class="engine-container">
        <button onclick="window.location.href='../index.html'" class="btn-voltar">
            ⬅️ Voltar para seleção de personagens
        </button>

        <div class="header-engine">
            <div>
                <div style="font-size: 0.75rem; letter-spacing: 2px; color: var(--accent-cyan);">MÓDULO DE ENGENHARIA HUMANA</div>
                <h1>Painel de Controle dos Pilares</h1>
            </div>
            <div class="status-badge">
                <span id="label-nivel">Lvl 1</span> | XP: <span id="label-xp">0</span>/<span id="label-proximo-xp">100</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Coluna de Controles / Sliders -->
            <div class="pilares-form">
                <p style="margin-top: 0; font-size: 0.85rem; color: var(--text-muted);">
                    Ajuste os valores diários dos seus pilares vitais. Cada manutenção e sincronização gera XP e calibragem para o sistema.
                </p>

                <div class="pilar-card">
                    <label>1. Autoconhecimento e Identidade (O "Eu"): <span id="val-p1">50</span>%</label>
                    <input type="range" id="pilar1" min="0" max="100" value="50" oninput="atualizarValoresVisuais()">
                </div>

                <div class="pilar-card">
                    <label>2. Relações Íntimas e Sociais (A Tribo): <span id="val-p2">50</span>%</label>
                    <input type="range" id="pilar2" min="0" max="100" value="50" oninput="atualizarValoresVisuais()">
                </div>

                <div class="pilar-card">
                    <label>3. Contribuição e Trabalho (O Papel Produtivo): <span id="val-p3">50</span>%</label>
                    <input type="range" id="pilar3" min="0" max="100" value="50" oninput="atualizarValoresVisuais()">
                </div>

                <div class="pilar-card">
                    <label>4. Vitalidade e Corpo (O Veículo): <span id="val-p4">50</span>%</label>
                    <input type="range" id="pilar4" min="0" max="100" value="50" oninput="atualizarValoresVisuais()">
                </div>

                <div class="pilar-card">
                    <label>5. Propósito e Transcendência (O Legado): <span id="val-p5">50</span>%</label>
                    <input type="range" id="pilar5" min="0" max="100" value="50" oninput="atualizarValoresVisuais()">
                </div>

                <button onclick="salvarManutencaoPilares()" class="btn-acao">⚙️ Sincronizar e Compilar Dados (+XP)</button>
            </div>

            <!-- Coluna do Gráfico -->
            <div class="chart-wrapper">
                <canvas id="graficoPilares"></canvas>
            </div>
        </div>
    </div>

    <!-- Importando a lógica em JavaScript -->
    <script src="engenheiro.js"></script>
</body>
</html>
