<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧙‍♂️ Torre do Mago - Estudos</title>
    
    <!-- CSS EMBUTIDO: À prova de falhas de carregamento e cache -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: #f5f7fa; 
            color: #2c3e50; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px 10px;
            position: relative;
        }

        /* O Canvas agora vai obrigatoriamente para o fundo */
        #canvas-fundo { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: -1; pointer-events: none; opacity: 0.4; 
        }

        .container { 
            max-width: 900px; margin: 0 auto; background: #ffffff; 
            padding: 25px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            position: relative; z-index: 1; 
        }

        h1, h2 { text-align: center; color: #2c3e50; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #6c5ce7; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; font-weight: 600; }

        .btn-voltar-container { text-align: center; margin-bottom: 25px; }
        .btn-voltar { 
            display: inline-block; text-decoration: none; padding: 10px 20px; 
            border-radius: 8px; background: #f1f2f6; color: #2f3542; 
            font-weight: bold; border: 1px solid #dfe4ea; transition: 0.2s; 
        }
        .btn-voltar:hover { background: #dfe4ea; }

        /* --- 1. PAINEL DE NÍVEL --- */
        .painel-nivel { 
            background: #f8f9fa; border: 2px solid #6c5ce7; 
            border-radius: 8px; padding: 15px; margin-bottom: 30px; 
        }
        .nivel-info { 
            display: flex; justify-content: space-between; 
            font-weight: bold; margin-bottom: 10px; color: #2c3e50; 
        }
        #texto-nivel { color: #6c5ce7; font-size: 1.1rem; }
        .barra-fundo { 
            background: #dfe6e9; height: 16px; 
            border-radius: 8px; overflow: hidden; 
        }
        #barra-preenchimento { 
            background: #6c5ce7; height: 100%; transition: width 0.4s; 
        }

        /* --- 2. ABAS DE MATÉRIAS E ASSUNTOS --- */
        .materias-menu { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 10px; margin-bottom: 20px; 
        }
        .materias-menu button { 
            background: #ffffff; border: 2px solid #a29bfe; color: #6c5ce7; 
            padding: 10px 18px; border-radius: 20px; font-weight: bold; 
            cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .materias-menu button:hover, .materias-menu button:focus { 
            background: #6c5ce7; color: #fff; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        .lista-assuntos { margin-bottom: 30px; }
        .item-assunto { 
            background: #f1f2f6; padding: 15px; border-radius: 8px; 
            margin-bottom: 15px; border-left: 5px solid #a29bfe; 
        }
        .item-assunto h3 { font-size: 1.1rem; margin-bottom: 5px; color: #2d3436; text-align: left; }

        /* QUADRADINHOS */
        .quadrados-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quadrado { 
            width: 26px; height: 26px; border: 2px solid #b2bec3; 
            border-radius: 5px; background: #fff; cursor: pointer; transition: 0.2s; 
        }
        .quadrado.check { 
            background: #00b894; border-color: #00b894; 
        }

        .divisor { border: none; border-top: 1px solid #dfe6e9; margin: 30px 0; }

        /* --- 3. ROTINA SEMANAL --- */
        .grid-semana { display: flex; flex-wrap: wrap; gap: 10px; }
        .dia-box { 
            flex: 1 1 110px; background: #f8f9fa; border: 1px solid #dfe6e9; 
            border-radius: 8px; padding: 10px; text-align: center; 
        }
        .dia-box span { 
            display: block; font-weight: bold; color: #636e72; 
            margin-bottom: 8px; font-size: 0.9rem; 
        }
        textarea { 
            width: 100%; height: 70px; border: 1px solid #b2bec3; 
            border-radius: 4px; padding: 8px; font-size: 0.9rem; 
            resize: none; outline: none; background: #fff; color: #2d3436; 
        }
        textarea:focus { border-color: #6c5ce7; }
    </style>
</head>
<body>
    <canvas id="canvas-fundo"></canvas>

    <div class="container">
        <!-- BOTÃO DE VOLTAR -->
        <div class="btn-voltar-container">
            <a href="index.html" class="btn-voltar">🔮 Voltar para Seleção de Classe</a>
        </div>

        <h1>🧙‍♂️ Torre do Mago</h1>
        <h2>Controle & Rotina de Estudos</h2>

        <!-- 1. TOPO: PAINEL DE NÍVEL E XP -->
        <div id="progresso-geral" class="painel-nivel">
            <div class="nivel-info">
                <span id="texto-nivel">Nível 1 (Mago)</span>
                <span id="texto-xp">0 / 100 XP</span>
            </div>
            <div class="barra-fundo">
                <div id="barra-preenchimento"></div>
            </div>
        </div>

        <!-- 2. MEIO: ABAS DE MATÉRIAS E QUADRADINHOS -->
        <div class="materias-menu">
            <button onclick="mostrarAssuntos('portugues')">Português</button>
            <button onclick="mostrarAssuntos('matematica')">Matemática</button>
            <button onclick="mostrarAssuntos('fisica')">Física</button>
            <button onclick="mostrarAssuntos('quimica')">Química</button>
            <button onclick="mostrarAssuntos('legislação')">Legislação</button>
        </div>
        
        <div id="lista-assuntos" class="lista-assuntos"></div>

        <hr class="divisor">

        <!-- 3. FUNDO: ROTINA SEMANAL -->
        <div class="rotina-semanal">
            <h2>🗓️ Rotina Semanal</h2>
            <div class="grid-semana">
                <div class="dia-box"><span>SEG</span><textarea id="seg" oninput="salvarRotina('seg')"></textarea></div>
                <div class="dia-box"><span>TER</span><textarea id="ter" oninput="salvarRotina('ter')"></textarea></div>
                <div class="dia-box"><span>QUA</span><textarea id="qua" oninput="salvarRotina('qua')"></textarea></div>
                <div class="dia-box"><span>QUI</span><textarea id="qui" oninput="salvarRotina('qui')"></textarea></div>
                <div class="dia-box"><span>SEX</span><textarea id="sex" oninput="salvarRotina('sex')"></textarea></div>
                <div class="dia-box"><span>SAB</span><textarea id="sab" oninput="salvarRotina('sab')"></textarea></div>
                <div class="dia-box"><span>DOM</span><textarea id="dom" oninput="salvarRotina('dom')"></textarea></div>
            </div>
        </div>
    </div>

    <!-- O Script JS continua externo -->
    <script src="./estudo.js?v=11"></script>
</body>
</html>
