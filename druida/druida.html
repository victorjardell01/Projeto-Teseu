<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosque do Druida - Dashboard Nutricional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="druid-container">
        <h2>🌿 Bosque do Druida - Ritual Nutricional</h2>
        
        <!-- Seletor de Dias da Semana -->
        <div class="day-selector">
            <button class="day-btn active" data-day="segunda">Segunda</button>
            <button class="day-btn" data-day="terca">Terça</button>
            <button class="day-btn" data-day="quarta">Quarta</button>
            <button class="day-btn" data-day="quinta">Quinta</button>
            <button class="day-btn" data-day="sexta">Sexta</button>
            <button class="day-btn" data-day="sabado">Sábado</button>
            <button class="day-btn" data-day="domingo">Domingo</button>
        </div>

        <!-- Painel de Status Diário (XP e Macros) -->
        <div class="status-panel">
            <div class="status-item">🔥 Calorias: <span id="calorias-atual">0</span> / 2100 kcal</div>
            <div class="status-item">🥩 Proteína: <span id="proteina-atual">0</span>g / 160g</div>
            <div class="status-item">🍞 Carbo: <span id="carbo-atual">0</span>g / 210g</div>
            <div class="status-item">🥑 Gordura: <span id="gordura-atual">0</span>g / 60g</div>
            <div class="status-item xp-badge">✨ XP: <span id="xp-atual">0</span></div>
        </div>

        <!-- Inventário de Alimentos do Druida -->
        <div class="ritual-section">
            <h3>🎒 Inventário de Alimentos (Adicionar ao Prato)</h3>
            
            <div class="inventory-controls">
                <select id="inventario-alimento" onchange="atualizarUnidadeMedida()">
                    <option value="">Selecione um item do inventário...</option>
                    <optgroup label="Fontes Acessíveis">
                        <option value="arroz" data-tipo="g">Arroz Cozido (por 100g)</option>
                        <option value="feijao" data-tipo="g">Feijão (por 100g)</option>
                        <option value="frango" data-tipo="g">Frango Grelhado / Desfiado (por 100g)</option>
                        <option value="ovo" data-tipo="unidade">Ovo Cozido / Mexido (por unidade)</option>
                        <option value="pao_frances" data-tipo="unidade">Pão Francês (por unidade)</option>
                        <option value="tapioca" data-tipo="g">Massa de Tapioca (por 100g)</option>
                        <option value="banana" data-tipo="unidade">Banana (por unidade)</option>
                        <option value="suco" data-tipo="ml">Suco / Leite / Bebida (por ml)</option>
                        <option value="sopa" data-tipo="ml">Sopão / Caldo (por ml)</option>
                    </optgroup>
                </select>

                <div class="input-group">
                    <input type="number" id="inventario-quantidade" placeholder="Qtd (g, ml ou un)" min="0" step="any">
                    <span id="label-unidade" style="align-self: center; color: #a3e4d7; font-size: 0.9rem;">un</span>
                    <button class="add-btn" onclick="adicionarDoInventario()">Adicionar ao Ritual</button>
                </div>
            </div>
        </div>

    </div>

    <script src="druida.js"></script>
</body>
</html>
