<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosque do Druida - Dashboard Nutricional</title>
    <style>
        :root {
            --bg-dark: #121e18;
            --bg-card: #1b2e23;
            --primary: #2e7d32;
            --accent: #a3e4d7;
            --accent-dim: #b2dfdb;
            --text-light: #e8f5e9;
            --border: #388e3c;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .druid-container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        h2, h3 {
            color: var(--accent);
            text-align: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
            margin-top: 0;
        }

        /* Seletor de Dias */
        .day-selector {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .day-btn {
            background: #16261d;
            border: 1px solid var(--border);
            color: var(--accent-dim);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .day-btn.active, .day-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Painéis de Status */
        .status-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .status-item {
            font-size: 0.95rem;
            color: var(--accent-dim);
        }

        .status-item span {
            font-weight: bold;
            color: #ffffff;
        }

        .status-wide {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 8px;
            margin-top: 4px;
        }

        .xp-badge {
            color: #ffd700;
        }

        /* Seção de Refeições */
        .ritual-section {
            background: rgba(18, 30, 24, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .meal-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            overflow-x: auto;
        }

        .meal-tab-btn {
            background: #16261d;
            border: 1px solid #274d34;
            color: var(--accent-dim);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            flex: 1;
            text-align: center;
        }

        .meal-tab-btn.active {
            background: var(--border);
            color: #ffffff;
            font-weight: bold;
        }

        .meal-inventory-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .inventory-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-info strong {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .item-action-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .item-action-group input {
            width: 60px;
            background: #121e18;
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }

        /* Botões de Ação */
        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: #388e3c;
        }

        /* Histórico */
        #lista-historico-peso {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            color: var(--accent-dim);
        }

        #lista-historico-peso li {
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 4px;
            border-left: 3px solid #ffd700;
        }
    </style>
</head>
<body>

    <div class="druid-container">
        <h2>🌿 Bosque do Druida - Ritual Nutricional</h2>
        
        <!-- 1. Seletor de Dias da Semana -->
        <div class="day-selector">
            <button class="day-btn active" data-day="segunda" onclick="selecionarDia('segunda')">Segunda</button>
            <button class="day-btn" data-day="terca" onclick="selecionarDia('terca')">Terça</button>
            <button class="day-btn" data-day="quarta" onclick="selecionarDia('quarta')">Quarta</button>
            <button class="day-btn" data-day="quinta" onclick="selecionarDia('quinta')">Quinta</button>
            <button class="day-btn" data-day="sexta" onclick="selecionarDia('sexta')">Sexta</button>
            <button class="day-btn" data-day="sabado" onclick="selecionarDia('sabado')">Sábado</button>
            <button class="day-btn" data-day="domingo" onclick="selecionarDia('domingo')">Domingo</button>
        </div>

        <!-- Painel de Status do Personagem (Peso, IMC e Déficit Dinâmico) -->
        <div class="status-panel" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
                <label>⚖️ Peso Atual (kg):</label>
                <input type="number" id="input-peso-atual" step="0.1" style="width: 80px; padding: 4px;" placeholder="Ex: 89">
                <button class="add-btn" onclick="atualizarPesoCorporal()">Atualizar Peso</button>
            </div>
            <div style="font-size: 0.9rem; color: #a3e4d7;">
                📊 IMC: <span id="imc-atual">0.0</span> | 🔥 Meta Calórica Dinâmica: <span id="meta-calorias">2100</span> kcal
            </div>
        </div>

        <!-- Painel de Status Diário (XP e Macros Consumidos) -->
        <div class="status-panel">
            <div class="status-item">🔥 Consumidas: <span id="calorias-atual">0</span> / <span id="meta-calorias-display">2100</span> kcal</div>
            <div class="status-item">🥩 Proteína: <span id="proteina-atual">0</span>g / 160g</div>
            <div class="status-item">🍞 Carbo: <span id="carbo-atual">0</span>g / 210g</div>
            <div class="status-item">🥑 Gordura: <span id="gordura-atual">0</span>g / 60g</div>
            <div class="status-item xp-badge">✨ XP: <span id="xp-atual">0</span></div>
        </div>

        <!-- 2. Seletor de Refeições do Dia -->
        <div class="ritual-section">
            <h3>🍽️ Refeições de <span id="label-dia-ativo">Segunda-feira</span></h3>
            <div class="meal-tabs">
                <button class="meal-tab-btn active" onclick="abrirRefeicao('cafe')">Café da Manhã</button>
                <button class="meal-tab-btn" onclick="abrirRefeicao('almoco')">Almoço</button>
                <button class="meal-tab-btn" onclick="abrirRefeicao('lanche')">Lanche da Tarde</button>
                <button class="meal-tab-btn" onclick="abrirRefeicao('jantar')">Jantar</button>
            </div>

            <div id="container-refeicao-ativa" class="meal-inventory-box"></div>
        </div>

        <!-- Seção para Adicionar Alimento Personalizado -->
<div class="ritual-section" style="border-style: dashed;">
    <h3>✨ Forjar Novo Alimento (Personalizado)</h3>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="novo-nome" placeholder="Nome do Alimento (ex: Frango Temperado)" style="background: #121e18; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px;">
        <div style="display: flex; gap: 5px;">
            <input type="number" id="novo-cal" placeholder="Calorias (kcal)" style="flex: 1; background: #121e18; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px;">
            <input type="number" id="novo-prot" placeholder="Proteína (g)" step="0.1" style="flex: 1; background: #121e18; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px;">
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="novo-carbo" placeholder="Carbo (g)" step="0.1" style="flex: 1; background: #121e18; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px;">
            <input type="number" id="novo-gord" placeholder="Gordura (g)" step="0.1" style="flex: 1; background: #121e18; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px;">
        </div>
        <button class="add-btn" onclick="adicionarAlimentoPersonalizado()" style="margin-top: 5px;">Salvar na Refeição Atual</button>
    </div>
</div>
        <!-- 3. Histórico de Evolução de Peso -->
        <div class="ritual-section" style="margin-top: 20px;">
            <h3>📜 Histórico de Evolução do Druida</h3>
            <ul id="lista-historico-peso" style="list-style: none; padding: 0; font-size: 0.9rem; color: #b2dfdb;">
                <!-- Injetado via JS -->
            </ul>
        </div>

    </div>

    <script src="druida.js"></script>
</body>
</html>
