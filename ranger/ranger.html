<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Teseu // Diário de Campo (Ranger)</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --paper-bg: #f4ebd0;
            --paper-card: #fcf8ec;
            --leather-dark: #2c1d11;
            --leather-medium: #4a3525;
            --accent-rust: #8c4a2b;
            --text-dark: #2b2218;
            --text-muted: #6b533f;
            --border-line: #d1bfa3;
        }

        body.ranger-body {
            background-color: #120e0a;
            background-image: radial-gradient(circle, #2d231b 0%, #120e0a 100%);
            color: var(--text-dark);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .journal-container {
            max-width: 900px;
            width: 100%;
            margin: 15px auto;
            background-color: var(--paper-bg);
            background-image: linear-gradient(to right, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0) 100%);
            border: 3px solid var(--leather-medium);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(139, 90, 43, 0.15);
            padding: 20px;
            border-radius: 6px;
            box-sizing: border-box;
            position: relative;
        }

        .btn-voltar {
            background: var(--leather-medium);
            color: var(--paper-bg);
            border: none;
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background: var(--accent-rust);
        }

        .journal-header-top {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: bold;
            text-transform: uppercase;
        }

        .journal-container h1 {
            font-family: 'Georgia', serif;
            color: var(--leather-dark);
            margin: 5px 0 8px 0;
            font-size: 1.6rem;
            border-bottom: 2px dashed var(--border-line);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .search-filter-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-filter-box input, 
        .search-filter-box select {
            padding: 10px 12px;
            background: #e6dac2;
            border: 1px solid var(--border-line);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        .search-filter-box input:focus, 
        .search-filter-box select:focus {
            border-color: var(--accent-rust);
            background: #f0e6d2;
        }

        .entry-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .entry-card {
            background: var(--paper-card);
            border: 1px solid var(--border-line);
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .entry-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid var(--border-line);
            border-radius: 2px;
            filter: sepia(25%) contrast(1.05);
        }

        .entry-card h3 {
            margin: 5px 0 0 0;
            font-family: 'Georgia', serif;
            color: var(--leather-dark);
            font-size: 1.1rem;
        }

        .badge {
            display: inline-block;
            background: var(--leather-medium);
            color: var(--paper-bg);
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 3px;
            align-self: flex-start;
            letter-spacing: 0.5px;
        }

        .entry-card p {
            font-size: 0.8rem;
            line-height: 1.45;
            color: var(--text-dark);
            margin: 0;
        }

        .entry-card p strong {
            color: var(--leather-dark);
        }

        @media (min-width: 600px) {
            body.ranger-body {
                padding: 20px;
            }
            .journal-container {
                padding: 35px;
                margin: 30px auto;
            }
            .search-filter-box {
                flex-direction: row;
            }
            .journal-container h1 {
                font-size: 2rem;
            }
        }

        @media (min-width: 768px) {
            .entry-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }
    </style>
</head>
<body class="ranger-body">

    <div class="journal-container">
        <button onclick="window.location.href='../index.html'" class="btn-voltar">
            ⬅️ Voltar ao Portal Teseu
        </button>

        <div class="journal-header-top">Projeto Teseu // Arquivo de Sobrevivência</div>
        <h1>Diário de Campo</h1>
        <p class="subtitle">"Notas de campo, espécimes botânicos, recursos silvestres e catalogação de fauna..." — N. Drake</p>

        <div class="search-filter-box">
            <input type="text" id="searchInput" placeholder="Pesquisar espécime (ex: Capim-Santo)..." onkeyup="filtrarItensRanger()">
            <select id="categoryFilter" onchange="filtrarItensRanger()">
                <option value="todos">-- Todas as Divisões --</option>
                <option value="infusoes">Plantas para Infusões</option>
                <option value="comestiveis">Plantas Comestíveis</option>
                <option value="frutiferas">Árvores Frutíferas</option>
                <option value="carnes">Carnes, Ovos e Afins</option>
            </select>
        </div>

        <div class="entry-grid" id="entryGridRanger"></div>
    </div>

    <script>
        const baseDeDadosRanger = [
            {
                nome: "Capim-Santo",
                categorias: ["infusoes"],
                termoBusca: "capim santo cidreira cha",
                tituloBadge: "Plantas para Infusões",
                paraQueServe: "Excelente calmante natural, alivia dores musculares e estados de ansiedade leve na trilha.",
                propriedades: "Antiespasmódico, bactericida e rico em mirceno.",
                imagem: "https://images.unsplash.com/photo-1597481499750-3e6b22637e12?auto=format&fit=crop&w=600&q=80"
            },
            {
                nome: "Hortelã-Comum",
                categorias: ["infusoes", "comestiveis"],
                termoBusca: "hortela menta cha tempero",
                tituloBadge: "Infusões / Comestíveis",
                paraQueServe: "Auxilia na digestão pesada após longas caminhadas, combate náuseas e refresca.",
                propriedades: "Rico em mentol, ação digestiva e antisséptica.",
                imagem: "https://images.unsplash.com/photo-1608686207856-001b95cf60ca?auto=format&fit=crop&w=600&q=80"
            },
            {
                nome: "Mangueira (Manga)",
                categorias: ["frutiferas"],
                termoBusca: "manga mangueira arvore fruta",
                tituloBadge: "Árvores Frutíferas",
                paraQueServe: "Fornece frutos densos em energia e carboidratos de rápida absorção.",
                propriedades: "Altíssima concentração de Vitamina A, C e fibras alimentares.",
                imagem: "https://images.unsplash.com/photo-1553279768-865429fa0078?auto=format&fit=crop&w=600&q=80"
            },
            {
                nome: "Ovos Silvestres / Caipiras",
                categorias: ["carnes"],
                termoBusca: "ovo ovos carnes proteina",
                tituloBadge: "Carnes, Ovos e Afins",
                paraQueServe: "Fonte primária e de altíssimo valor biológico para reconstrução muscular na selva.",
                propriedades: "Rico em proteínas completas, colina e vitaminas do complexo B.",
                imagem: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=600&q=80"
            }
        ];

        function renderizarCatalogoRanger(itens) {
            const grid = document.getElementById('entryGridRanger');
            if (!grid) return;
            grid.innerHTML = '';

            if (itens.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; font-style: italic; color: var(--text-muted); padding: 20px;">Nenhum espécime encontrado nas anotações...</p>';
                return;
            }

            itens.forEach(item => {
                const card = document.createElement('div');
                card.className = 'entry-card';
                card.innerHTML = `
                    <img src="${item.imagem}" alt="${item.nome}">
                    <h3>${item.nome}</h3>
                    <span class="badge">${item.tituloBadge}</span>
                    <p><strong>Para que serve:</strong> ${item.paraQueServe}</p>
                    <p><strong>Propriedades:</strong> ${item.propriedades}</p>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarItensRanger() {
            let input = document.getElementById('searchInput').value.toLowerCase().trim();
            let categoriaSelecionada = document.getElementById('categoryFilter').value;

            let itensFiltrados = baseDeDadosRanger.filter(item => {
                let correspondeNome = item.nome.toLowerCase().includes(input) || item.termoBusca.includes(input);
                let correspondeCategoria = (categoriaSelecionada === 'todos' || item.categorias.includes(categoriaSelecionada));
                return correspondeNome && correspondeCategoria;
            });

            renderizarCatalogoRanger(itensFiltrados);
        }

        window.onload = () => {
            renderizarCatalogoRanger(baseDeDadosRanger);
        };
    </script>
</body>
</html>
